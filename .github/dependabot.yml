version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: sunday
      time: "18:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: chore
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
